services:
  - type: web
    name: mach-sfrg-web
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mach-sfrg-db
          property: connectionString
      - key: AUTHORIZED_EMAILS
        value: michael.arthur.mil@health.mil,test.user@health.mil,Michael.j.arthur2.mil@health.mil
      - key: ADMIN_EMAILS
        value: michael.arthur.mil@health.mil
      - key: SESSION_HOURS
        value: "12"
databases:
  - name: mach-sfrg-db
    plan: basic-256mb

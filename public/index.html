<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PWA Roster Calendar</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CalTest">
  
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 0; background-color: #f0f2f5;
      display: flex; flex-direction: column; height: 100vh; align-items: center; justify-content: center;
    }
    .card {
      background: white; padding: 30px; border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center;
      width: 90%; max-width: 400px; box-sizing: border-box;
    }
    .hidden { display: none !important; }
    h2 { color: #1a73e8; margin-top: 0; }
    input {
      width: 100%; padding: 12px; margin: 10px 0;
      border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; box-sizing: border-box;
    }
    button {
      background-color: #1a73e8; color: white; border: none;
      width: 100%; padding: 12px; font-size: 1rem; border-radius: 6px; cursor: pointer;
    }
    .error { color: #d93025; margin-top: 10px; font-size: 0.9rem; }
    iframe { width: 100%; max-width: 800px; height: 600px; border: none; border-radius: 8px; }
  </style>
</head>
<body>

  <!-- STEP 1: EMAIL ENTRY VIEW -->
  <div id="email-view" class="card">
    <h2>Roster Verification</h2>
    <p>Enter your official medical inbox address to access the app schedule.</p>
    <input type="email" id="email-input" placeholder="name.lastname@health.mil">
    <button onclick="requestPin()">Request Access PIN</button>
    <div id="email-error" class="error"></div>
  </div>

  <!-- STEP 2: PIN ENTRY VIEW -->
  <div id="pin-view" class="card hidden">
    <h2>Enter Verification PIN</h2>
    <p>Type the 6-digit access code sent to your official inbox.</p>
    <input type="text" id="pin-input" placeholder="000000" maxlength="6">
    <button onclick="verifyPin()">Verify & Open App</button>
    <div id="pin-error" class="error"></div>
  </div>

  <!-- STEP 3: MAIN CALENDAR INTERFACE VIEW -->
  <div id="calendar-view" class="hidden" style="width: 100%; display: flex; flex-direction: column; align-items: center; padding: 20px;">
    <h2>Upcoming Events</h2>
    <!-- YOUR CALENDAR GRID LINK -->
    <iframe src="https://google.com"></iframe>
  </div>

  <script>
    let savedEmail = '';

    // A. Request pin code from your server engine
    async function requestPin() {
      const emailInput = document.getElementById('email-input').value;
      const errorDiv = document.getElementById('email-error');
      errorDiv.innerText = '';

      const response = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: emailInput })
      });

      const data = await response.json();
      if (data.success) {
        savedEmail = emailInput;
        document.getElementById('email-view').classList.add('hidden');
        document.getElementById('pin-view').classList.remove('hidden');
      } else {
        errorDiv.innerText = data.message;
      }
    }

    // B. Verify pin and retrieve secure token block
    async function verifyPin() {
      const pinInput = document.getElementById('pin-input').value;
      const errorDiv = document.getElementById('pin-error');
      errorDiv.innerText = '';

      const response = await fetch('/api/auth/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: savedEmail, pin: pinInput })
      });

      const data = await response.json();
      if (data.success) {
        // Save the access token token safely in phone browser memory
        localStorage.setItem('app_token', data.token);
        
        document.getElementById('pin-view').classList.add('hidden');
        document.getElementById('calendar-view').classList.remove('hidden');
      } else {
        errorDiv.innerText = data.message;
      }
    }
  </script>
</body>
</html>
